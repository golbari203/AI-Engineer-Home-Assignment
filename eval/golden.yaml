# Golden questions.
#
# Every one is derived from something in the portfolio folder, not invented.
# A suite of questions a naive build would also pass proves nothing; each entry
# below corresponds to a way this corpus breaks a system that does not handle it.
#
# Three kinds of check, so most of the set runs with no API key:
#   tool       call a tool directly and assert on its output
#   retrieval  the expected document must appear in the top k passages
#   answer     the full agent answer, graded by a judge (needs --live)

- id: costco_total
  category: portfolio_arithmetic
  question: How much Costco do I own?
  why: Held in two accounts, two entities, two currencies. The failure is 1,400.
  tool: {name: get_holdings, args: {ticker: COST}}
  expect: {total_quantity: 2300, held_in_accounts: 2}
  answer: {must_mention: ["2,300"], must_not_mention: ["1,400 shares in total"]}

- id: costco_value
  category: portfolio_arithmetic
  question: What is my Costco position worth in dollars?
  why: The Swiss line is in CHF and must be converted at the statement rate.
  tool: {name: get_holdings, args: {ticker: COST}}
  expect: {total_securities_usd: {approx: 2115079.99, tol: 1.0}}

- id: portfolio_value
  category: portfolio_arithmetic
  question: What is my portfolio worth?
  why: Cash is a quarter of the account; securities alone understates by 25%.
  tool: {name: get_holdings, args: {}}
  expect:
    total_securities_usd: {approx: 14659025.49, tol: 1.0}
    total_portfolio_value_usd: {approx: 20125683.75, tol: 2000.0}
  answer: {must_mention: ["20,1"]}

- id: nvidia_shares
  category: portfolio_arithmetic
  question: How many NVIDIA shares do I hold?
  why: The trades net to minus 2,200 unless the 10-for-1 split is applied.
  tool: {name: get_holdings, args: {ticker: NVDA}}
  expect: {total_quantity: 14000}
  answer: {must_mention: ["14,000"], must_not_mention: ["-2,200", "short"]}

- id: nvidia_trade_history
  category: portfolio_arithmetic
  question: When did I buy NVIDIA and how many shares?
  why: The purchase is recorded pre-split as 1,800.
  tool: {name: get_transactions, args: {ticker: NVDA, type: BUY}}
  expect: {net_shares: 18000}

- id: biggest_position
  category: portfolio_arithmetic
  question: What is my largest single holding?
  why: Needs every row, not a top-k sample.
  tool: {name: get_holdings, args: {}}
  expect: {positions_count: 9}
  answer: {must_mention: ["Microsoft"]}

- id: jpm_share_count
  category: conflict_resolution
  question: How many JPMorgan shares do I own?
  why: Custodian says 7,250; the family office file says 7,520.
  tool: {name: get_holdings, args: {ticker: JPM}}
  expect: {total_quantity: 7250, has_book_disagreement: true}
  answer: {must_mention: ["7,250", "7,520"]}

- id: records_check
  category: conflict_resolution
  question: Is anything wrong with my records?
  why: Seven real exceptions, three of them errors.
  tool: {name: get_data_quality, args: {}}
  expect: {exception_count: 7, error_count: 3}
  answer: {must_mention: ["Costco", "JPMorgan"]}

- id: costco_missing_from_books
  category: conflict_resolution
  question: Are my own records complete?
  why: The Trust's 900 Costco shares are absent from the position file.
  tool: {name: get_data_quality, args: {ticker: COST}}
  expect: {min_exception_count: 1}

- id: unh_cost_basis
  category: conflict_resolution
  question: What did I pay for UnitedHealth?
  why: The stated CHF basis implies 0.7917 when the purchase-date rate was 0.8545.
  tool: {name: get_data_quality, args: {ticker: UNH}}
  expect: {min_exception_count: 1}

- id: nvidia_guidance
  category: conflict_resolution
  question: What did NVIDIA guide to for the next quarter?
  why: One transcript says 41.4 million, the corrected one says 41.4 billion.
  retrieval:
    query: NVIDIA revenue outlook guidance next quarter
    ticker: NVDA
    expect_any: [NVIDIA_Q4_FY2026_earnings_call_-_Verbatim.pdf, nvda-q4-fy26.pdf,
                 Calder___Rowe_NVDA_Mar_2026.pdf]
    forbid: [NVDA_Q4_FY26_call_transcript.pdf]
  answer: {must_mention: ["billion"], must_not_mention: ["41.4 million"]}

- id: aws_q4_revenue
  category: conflict_resolution
  question: What was AWS revenue in the fourth quarter of 2025?
  why: 23.9 as reported, 24.7 recast; the 10-Q explains the reclassification.
  retrieval:
    query: AWS segment revenue reclassification recast
    ticker: AMZN
    expect_any: [Amazon_10-Q_Q1_2026.pdf]
  answer: {must_mention: ["recast"]}

- id: lilly_2025_revenue
  category: conflict_resolution

  why: Two brokers disagree; the company's own deck settles it at 49.3.
  retrieval:
    query: Lilly 2025 revenue recap
    ticker: LLY
    expect_any: [Lilly_R_D_Day_2026_slides.pdf, Halvard_Research_LLY_5_May_2026.pdf]
  answer: {must_mention: ["49.3"]}

